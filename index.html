<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Tsunami: Brainrot Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <header>
            <h1>ESCAPE TSUNAMI: BRAINROT EDITION</h1>
            <div id="stats-bar">
                <span>Score: <strong id="scoreVal">0</strong></span>
                <span>Level: <strong id="levelVal">1</strong></span>
            </div>
        </header>

        <div id="game-container">
            <canvas id="gameCanvas" width="900" height="450"></canvas>
            <div id="instructions">Use LEFT / RIGHT arrows or A / D to run away from the wave! Avoid obstacles and collect brainrot powerups.</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
