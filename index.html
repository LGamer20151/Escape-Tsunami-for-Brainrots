<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Tsunami: Brainrot Edition</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #1a1a2e;
            border: 6px dashed #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            display: block;
            margin: 20px auto;
        }
        h1 {
            color: #00ffff;
            text-shadow: 3px 3px #ff0000;
            margin-bottom: 5px;
        }
        p {
            color: #ffff00;
        }
    </style>
</head>
<body>

    <h1>ESCAPE TSUNAMI: BRAINROT EDITION</h1>
    <p>Use A/D or LEFT/RIGHT arrows to move, W or UP to jump. Outclimb the wave!</p>
    
    <canvas id="gameCanvas" width="450" height="650"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 210,
            y: 500,
            width: 35,
            height: 35,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -11,
            grounded: false
        };

        let gravity = 0.45;
        let keys = {};
        let tsunamiY = 650;
        let tsunamiSpeed = 0.45;
        let score = 0;
        let gameState = "playing";

        // Brainrot-themed platforms with custom labels
        let platforms = [
            { x: 0, y: 600, width: 450, height: 50, label: "SKIBIDI FLOOR" },
            { x: 50, y: 480, width: 120, height: 20, label: "GYATT LEDGE" },
            { x: 250, y: 390, width: 140, height: 20, label: "RIZZZ PLATFORM" },
            { x: 80, y: 300, width: 130, height: 20, label: "FANUM TAX" },
            { x: 220, y: 200, width: 130, height: 20, label: "SIGMA TOWER" },
            { x: 50, y: 100, width: 120, height: 20, label: "OHIO PEAK" }
        ];

        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function resetGame() {
            player.x = 210;
            player.y = 500;
            player.vx = 0;
            player.vy = 0;
            tsunamiY = 650;
            score = 0;
            gameState = "playing";
        }

        function update() {
            if (gameState !== "playing") return;

            if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
            else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;
            else player.vx = 0;

            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.grounded = false;
            for (let p of platforms) {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            tsunamiY -= tsunamiSpeed;
            score++;

            if (player.y + player.height >= tsunamiY) {
                gameState = "gameover";
            }
        }

        function draw() {
            // Background grid aesthetic
            ctx.fillStyle = "#110022";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "playing") {
                // Draw platforms with text
                for (let p of platforms) {
                    ctx.fillStyle = "#ff00ff";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "12px Arial";
                    ctx.fillText(p.label, p.x + 8, p.y + 15);
                }

                // Draw Player (Sigma Block)
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Draw Tsunami Wave (Brainrot Wave)
                ctx.fillStyle = "rgba(255, 50, 50, 0.85)";
                ctx.fillRect(0, tsunamiY, canvas.width, canvas.height - tsunamiY);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.fillText("🌊 RISING CRINGE WAVE 🌊", 120, tsunamiY + 25);

                // Draw Score
                ctx.fillStyle = "#00ffff";
                ctx.font = "18px Arial";
                ctx.fillText("Survival Score: " + Math.floor(score / 10), 25, 35);
            } else {
                ctx.fillStyle = "#ff0000";
                ctx.font = "35px Arial";
                ctx.fillText("YOU GOT TAXED!", 75, 260);
                ctx.fillStyle = "#ffff00";
                ctx.font = "20px Arial";
                ctx.fillText("Press SPACE to Retry", 125, 320);

                if (keys["Space"]) {
                    resetGame();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
