<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Tsunami</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #222;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            margin: 20px auto;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 5px;
        }
        p {
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Escape the Tsunami!</h1>
    <p>Use LEFT and RIGHT arrows to move, UP arrow or SPACE to jump. Climb to survive!</p>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 185,
            y: 450,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: -10,
            grounded: false
        };

        let gravity = 0.4;
        let keys = {};
        let tsunamiY = 600;
        let tsunamiSpeed = 0.4;
        let score = 0;
        let gameState = "playing";

        // Platforms
        let platforms = [
            { x: 0, y: 550, width: 400, height: 50 },
            { x: 50, y: 440, width: 100, height: 15 },
            { x: 220, y: 360, width: 120, height: 15 },
            { x: 100, y: 270, width: 110, height: 15 },
            { x: 200, y: 180, width: 120, height: 15 },
            { x: 50, y: 90, width: 100, height: 15 }
        ];

        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function resetGame() {
            player.x = 185;
            player.y = 450;
            player.vx = 0;
            player.vy = 0;
            tsunamiY = 600;
            score = 0;
            gameState = "playing";
        }

        function update() {
            if (gameState !== "playing") return;

            // Movement controls
            if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
            else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;
            else player.vx = 0;

            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Apply gravity
            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Screen boundaries
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Platform collisions
            player.grounded = false;
            for (let p of platforms) {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            // Rise tsunami
            tsunamiY -= tsunamiSpeed;
            score++;

            // Check game over
            if (player.y + player.height >= tsunamiY) {
                gameState = "gameover";
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = "#1e1e2f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "playing") {
                // Draw platforms
                ctx.fillStyle = "#4cd137";
                for (let p of platforms) {
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                }

                // Draw player
                ctx.fillStyle = "#e84118";
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Draw tsunami wave
                ctx.fillStyle = "rgba(0, 168, 204, 0.8)";
                ctx.fillRect(0, tsunamiY, canvas.width, canvas.height - tsunamiY);

                // Draw score
                ctx.fillStyle = "#fff";
                ctx.font = "16px Arial";
                ctx.fillText("Score: " + Math.floor(score / 10), 20, 30);
            } else {
                ctx.fillStyle = "#fff";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", 110, 250);
                ctx.font = "18px Arial";
                ctx.fillText("Press SPACE to Restart", 105, 300);

                if (keys["Space"]) {
                    resetGame();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
